[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apri-p7m"
version = "0.3.0"
description = "Extract the PDF and signer metadata embedded in .p7m (CMS/PKCS#7) envelopes"
requires-python = ">=3.9"
dependencies = [
    "asn1crypto>=1.5.1",
]

[project.scripts]
apri-py-p7m = "apri_p7m.cli:main"

[tool.setuptools]
packages = ["apri_p7m"]
